services:
  app:
    build: .
    container_name: kavling-backend-app
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Asia/Jakarta
    depends_on:
      - db
    networks:
      - proxy-network
      - kavling-internal

  db:
    image: postgres:15-alpine
    container_name: kavling-backend-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Asia/Jakarta
    volumes:
      - kavling_db_data:/var/lib/postgresql/data
    networks:
      - kavling-internal

networks:
  proxy-network:
    external: true
  kavling-internal:
    driver: bridge

volumes:
  kavling_db_data:
