services:
  app:
    build: .
    container_name: kavling-backend-app
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Asia/Jakarta
    depends_on:
      - db
    networks:
      - proxy-network
      - kavling-internal

  db:
    image: mysql:8.0
    container_name: kavling-backend-db
    command: --skip-name-resolve --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Jakarta
    volumes:
      - kavling_db_data:/var/lib/mysql
    networks:
      - kavling-internal

networks:
  proxy-network:
    external: true
  kavling-internal:
    driver: bridge

volumes:
  kavling_db_data:
