name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: setup_express_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    strategy:
      matrix:
        node-version: [23.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create .env.test
        run: |
          echo 'NODE_ENV="test"' > .env.test
          echo 'DATABASE_URL="mysql://root:root_password@127.0.0.1:3306/setup_express_test"' >> .env.test
          echo 'PORT=3001' >> .env.test
          echo 'CORS_ORIGINS="http://localhost:3000"' >> .env.test
          echo 'JWT_SECRET="rahasia-dummy-untuk-test-ci-cd"' >> .env.test
          echo 'AWS_ACCESS_KEY_ID="dummy-aws-access-key"' >> .env.test
          echo 'AWS_SECRET_ACCESS_KEY="dummy-aws-secret-key"' >> .env.test
          echo 'CLOUDINARY_CLOUD_NAME="dummy-cloud"' >> .env.test
          echo 'CLOUDINARY_API_KEY="1234567890"' >> .env.test
          echo 'CLOUDINARY_API_SECRET="dummy-secret"' >> .env.test
          echo 'CLOUDINARY_URL="cloudinary://123:secret@dummy-cloud"' >> .env.test
          echo 'SENTRY_DSN="https://dummy_key@sentry.io/12345"' >> .env.test
          echo 'GEMINI_API_KEY="API_KEY"' >> .env.test

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Push Database Schema
        run: npm run db:push:test

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test
